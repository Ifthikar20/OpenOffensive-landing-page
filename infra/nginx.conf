# nginx site for the landing page. deploy-ec2.sh installs this on the server.
# HTTPS is handled by Cloudflare; the server only needs to speak HTTP on port 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/openoffensive;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Built assets have hashed names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The build writes one folder per page (docs/index.html and so on).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
